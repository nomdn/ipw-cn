name: Build and Deploy frontend-svelte to Cloudflare Workers

on:
  push:
    branches: ['main']
    paths:
      - 'frontend-svelte/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 包管理器是 bun（见 frontend-svelte/bun.lock），不再用 pnpm/npm
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 部署到 Cloudflare Workers
      # --keep-vars：保留 Worker 上已配置的环境变量（如 API_KEYS），别被本次部署清掉
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd frontend-svelte
          bun install --frozen-lockfile
          bun run build
          bunx wrangler deploy --keep-vars
