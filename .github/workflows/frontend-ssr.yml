name: (已停用自动部署) frontend-ssr → Cloudflare Workers

# 前端已迁移到 frontend-svelte（SvelteKit + shadcn-svelte，包管理器 bun），
# 自动部署改由 .github/workflows/frontend-svelte.yml 负责。
#
# 这里**刻意去掉 push 触发**：两个 workflow 都部署同名 Worker（wrangler.jsonc 里的 "ipw-cn"），
# 若继续按 push 触发，改 frontend-ssr 会把新前端的线上版本覆盖掉。
# 保留 workflow_dispatch 只是为了万一还需要临时用旧站顶一下（手动触发）。
# 新前端确认稳定后，这个文件可以直接删除。
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        with:
          version: 10

      # 部署到 Cloudflare Workers
      - name: Deploy to Cloudflare Workers

        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NITRO_PRESET: cloudflare_module
        run: |
          cd frontend-ssr
          pnpm install
          pnpm run deploy --keep-vars